name: Desktop installer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build backend sidecar
        shell: pwsh
        run: ./scripts/build-sidecar.ps1 -SkipSimulationEngines
      - name: Install JS dependencies
        shell: pwsh
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Build Windows installer
        shell: pwsh
        run: npx tauri build --config src-tauri/tauri.conf.json --bundles nsis
      - name: Verify installer output
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $files) { throw "No NSIS .exe installer found" }
          $files | ForEach-Object { Write-Host "Built: $($_.FullName)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Economy-Lab-v2.12-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
