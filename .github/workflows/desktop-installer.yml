name: Desktop installer

# Builds the Windows Tauri desktop installer (.exe/.msi). Runs on a real
# windows-latest runner because Tauri links against the OS WebView and MSVC
# toolchain — it cannot be cross-compiled reliably from Linux.
#
# The Python backend is bundled into the installer as a PyInstaller sidecar
# (see scripts/build-sidecar.ps1), so the resulting installer needs nothing
# preinstalled on the target machine: no Python, no Node, no Rust.
#
# Trigger manually from the Actions tab to test a build, or push a `v*` tag
# to also publish the installer to a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      include_simulation_engines:
        description: "Bundle Mesa/HARK inside the installer (larger, slower build)"
        type: boolean
        default: false
  push:
    branches:
      - "codex/build-v2-13-0"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Run backend tests and preserve report
        shell: pwsh
        run: |
          python -m pip install "./backend[dev]"
          python -m pytest -q backend/tests 2>&1 | Tee-Object -FilePath pytest-output.txt
          if ($LASTEXITCODE -ne 0) { Write-Warning "Backend tests failed; report will be uploaded for diagnosis." }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build backend sidecar (PyInstaller)
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.include_simulation_engines }}" -eq "true") {
            ./scripts/build-sidecar.ps1
          } else {
            ./scripts/build-sidecar.ps1 -SkipSimulationEngines
          }

      - name: Install JS dependencies
        shell: pwsh
        run: |
          npm install
          npm --prefix frontend install

      - name: Build Tauri desktop installer
        shell: pwsh
        run: npx tauri build --config src-tauri/tauri.conf.json

      - name: Verify installer output
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Path "src-tauri/target/release/bundle" -Include *.exe,*.msi -ErrorAction SilentlyContinue
          if (-not $files) { throw "No .exe/.msi installer found under src-tauri/target/release/bundle" }
          $files | ForEach-Object { Write-Host "Built: $($_.FullName)" }

      - uses: actions/upload-artifact@v4
        with:
          name: economy-lab-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economy-lab-backend-test-report
          path: pytest-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
