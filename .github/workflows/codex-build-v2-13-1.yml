name: Codex Windows build v2.13.1
on:
  push:
    branches:
      - codex/build-v2-13-1
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"
          python -m pytest -q backend/tests
      - name: Build backend sidecar
        shell: pwsh
        run: ./scripts/build-sidecar.ps1 -SkipSimulationEngines
      - name: Install JS dependencies
        shell: pwsh
        run: |
          npm ci
          npm --prefix frontend ci
      - name: Build frontend
        shell: pwsh
        run: npm --prefix frontend run build
      - name: Build installer
        shell: pwsh
        run: npx tauri build --config src-tauri/tauri.conf.json
      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Path "src-tauri/target/release/bundle" -Include *.exe -ErrorAction SilentlyContinue
          if (-not $files) { throw "NSIS installer not found" }
          $files | ForEach-Object { Write-Host "Built: $($_.FullName) ($($_.Length) bytes)" }
      - uses: actions/upload-artifact@v4
        with:
          name: economy-lab-v2.13.1-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
