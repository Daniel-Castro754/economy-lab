name: Managed runtime Windows build
on:
  push:
    branches: ['build/runtime-v2.14.0']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Backend tests
        shell: pwsh
        run: |
          python -m pip install -e './backend[dev]'
          if ($LASTEXITCODE -ne 0) { throw 'Backend dependency installation failed' }
          Set-Location backend
          python -m pytest -q --junitxml=../backend-tests.xml
          if ($LASTEXITCODE -ne 0) { throw 'Backend tests failed' }
      - name: Compile matching installer
        shell: pwsh
        run: ./scripts/build-desktop.ps1 -SkipSimulationEngines
      - name: Smoke test bundled backend
        shell: pwsh
        run: |
          python scripts/smoke-packaged-backend.py src-tauri/binaries/economy-lab-backend-x86_64-pc-windows-msvc.exe
          if ($LASTEXITCODE -ne 0) { throw 'Bundled backend smoke test failed' }
      - name: Install NSIS and verify managed engines
        shell: pwsh
        run: |
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          python scripts/smoke-managed-runtime.py "$installer"
          if ($LASTEXITCODE -ne 0) { throw 'Installed managed runtime smoke test failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-v2.14.0-tests
          path: |
            backend-tests.xml
            managed-runtime-smoke.json
            managed-installation.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-v2.14.0-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
