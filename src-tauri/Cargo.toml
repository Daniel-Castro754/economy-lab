[package]
name = "economy-lab-desktop"
version = "2.12.0"
description = "Economy Lab desktop shell"
authors = ["Economy Lab contributors"]
edition = "2021"

[lib]
name = "economy_lab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
